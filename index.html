<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hear My Voice</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              fontFamily: {
                "press-start": ['"Press Start 2P"', "cursive"],
                inter: ["Inter", "sans-serif"],
              },
              colors: {
                pink: "#ffc0cb",
                white: "#ffffff",
              },
            },
          },
        };
    </script>
    <style>
      body {
        margin: 0;
        font-family: "Press Start 2P", cursive;
        background-image: url(https://i.pinimg.com/736x/0b/6d/83/0b6d83022b5326ca71c715e7c1743dfb.jpg);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        overflow: hidden;
      }

      #overlay {
        position: fixed;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 1);
        transition: background-color 3s ease-in-out;
        z-index: 1;
      }

      .title {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 2rem;
        text-shadow: 0 4px 0 black, 0 6px 0 black;
        white-space: nowrap;
        opacity: 0;
        z-index: 2;
      }

      .title.animated {
        animation: titleIn 2.5s forwards, titleUp 2.5s 2.5s forwards;
      }

      @keyframes titleIn {
        to {
          opacity: 1;
        }
      }

      @keyframes titleUp {
        from {
          top: 50%;
          transform: translate(-50%, -50%);
        }
        to {
          top: 5%;
          transform: translate(-50%, 0);
        }
      }

      .dialogue-box {
        position: absolute;
        bottom: 10%;
        left: 10%;
        width: 80%;
        background-color: transparent;
        padding: 20px;
        z-index: 2;
        display: none;
        flex-direction: column;
        justify-content: space-between;
        max-height: 40vh;
        overflow: hidden;
      }

      .chat-log {
        overflow-y: auto;
        max-height: 60%;
        margin-bottom: 0.5rem;
      }

      .dialogue-entry {
        margin-bottom: 12px;
        padding: 12px;
        background-color: rgba(255, 255, 255, 0.85);
        border-radius: 16px;
        box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: "Inter", sans-serif;
        font-size: 1rem;
        color: #111;
      }

      .username {
        font-family: "Press Start 2P", cursive;
        font-size: 0.7rem;
        margin-right: 6px;
      }

      .username.rellcyaa {
        color: #3b82f6;
      }

      .username.vanilla {
        color: #ff69b4;
      }

      .typing-indicator {
        display: inline-block;
        font-style: italic;
        color: #999;
        margin-left: 8px;
      }

      .bottom-ui {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        margin-top: auto;
        z-index: 3;
      }

      .tap-hint {
        font-size: 0.8rem;
        font-family: "Press Start 2P", cursive;
        color: #d63384;
        display: none;
        align-items: center;
        gap: 0.5rem;
        animation: blink 1.5s ease-in-out infinite;
        background-color: rgba(255, 255, 255, 0.6);
        padding: 6px 10px;
        border-radius: 12px;
      }

      .tap-arrow {
        display: inline-block;
        font-size: 1rem;
        color: #ff69b4;
        animation: heartNudge 1s ease-in-out infinite;
      }

      @keyframes heartNudge {
        0% {
          transform: scale(1) translateX(0);
        }
        50% {
          transform: scale(1.1) translateX(4px);
        }
        100% {
          transform: scale(1) translateX(0);
        }
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      #question {
        font-size: 1.4rem;
        font-weight: 500;
        color: #ff61a6;
        text-align: center;
        font-family: "Inter", sans-serif;
        display: none;
      }

      .button-group {
        display: none;
        gap: 1rem;
        justify-content: center;
      }

      .choice-btn {
        padding: 10px 20px;
        font-weight: bold;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.3s ease;
        font-size: 1.1rem;
        text-transform: capitalize;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        font-family: "Inter", sans-serif;
        font-weight: 600;
        z-index: 3;
      }

      .yes-btn {
        background-color: #ff61a6;
        color: white;
        border: 2px solid #ff61a6;
      }

      .no-btn {
        background-color: #f7a4b7;
        color: white;
        border: 2px solid #f7a4b7;
      }

      .choice-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      }

      .choice-btn:focus {
        outline: none;
        box-shadow: 0 0 5px 2px rgba(255, 105, 180, 0.7);
      }
    </style>
  </head>
  <body>
    <!-- rest of the document stays unchanged -->

    <div id="overlay"></div>
    <div class="title" id="title">An Unheard Confession</div>
    <div class="dialogue-box" id="dialogueBox">
      <div class="chat-log" id="dialogueContent"></div>

      <div class="bottom-ui">
        <div class="tap-hint" id="tapHint">
          tekan untuk lanjutkan <span class="tap-arrow">❤</span>
        </div>
        <div id="question">apa jawabanmu? ☺️</div>
        <div class="button-group" id="buttonGroup">
          <button class="choice-btn yes-btn" onclick="handleResponse('y')">
            Iya
          </button>
          <button class="choice-btn no-btn" onclick="handleResponse('n')">
            Tidak
          </button>
        </div>
      </div>
    </div>

    <script>
      const overlay = document.getElementById("overlay");
      const title = document.getElementById("title");
      const dialogueBox = document.getElementById("dialogueBox");
      const dialogueContent = document.getElementById("dialogueContent");
      const question = document.getElementById("question");
      const buttonGroup = document.getElementById("buttonGroup");
      const tapHint = document.getElementById("tapHint");

      let refusalCount = 0;

      function delay(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function autoScrollChat() {
        dialogueContent.scrollTop = dialogueContent.scrollHeight;
      }

      async function showTypingAnimation(length) {
        const typing = document.createElement("div");
        typing.className = "typing-indicator";
        typing.textContent = ".";
        dialogueContent.appendChild(typing);
        autoScrollChat();

        let dots = 1;
        const duration = Math.max(1000, length * 20);
        const interval = setInterval(() => {
          typing.textContent = ".".repeat((dots++ % 3) + 1);
        }, 400);

        await delay(duration);
        clearInterval(interval);
        typing.remove();
      }

      async function appendDialogue(text, speaker = "rellcyaa") {
        const entry = document.createElement("div");
        entry.className = "dialogue-entry";

        const username = document.createElement("span");
        username.className = `username ${speaker}`;
        username.textContent =
          speaker === "rellcyaa" ? "Rellcyaa: " : "Vanilla: ";

        entry.appendChild(username);
        dialogueContent.appendChild(entry);
        autoScrollChat();

        await delay(300);
        await showTypingDots(); // Show typing dots first
        await typewriterEffect(entry, text); // Apply typewriter effect after dots
      }

      async function showTypingDots() {
        const typingDots = document.createElement("div");
        typingDots.className = "typing-indicator";
        typingDots.textContent = ".";
        dialogueContent.appendChild(typingDots);
        autoScrollChat();

        let dots = 1;
        const interval = setInterval(() => {
          typingDots.textContent = ".".repeat((dots++ % 3) + 1);
        }, 400);

        // Show typing dots for a specific duration
        await delay(1500);

        clearInterval(interval);
        typingDots.remove(); // Remove the typing dots after the delay
      }

      async function typewriterEffect(entry, text) {
        const messageSpan = document.createElement("span");
        entry.appendChild(messageSpan);
        messageSpan.textContent = ""; // Clear text for animation

        for (let i = 0; i < text.length; i++) {
          messageSpan.textContent += text.charAt(i);
          await delay(100); // Adjust typing speed here
        }
      }

      async function startDialogue() {
        await showTitleAndFade();
        await delay(1500);

        await appendDialogue("Haii, vanilla!!");
        await delay(500);
        await appendDialogue(
          "boleh aku minta waktunya sebentar untuk bermain?"
        );
        await delay(300);

        showQuestion();
      }

      function showQuestion(forceOneButton = false) {
        question.style.display = "block";
        buttonGroup.style.display = "flex";

        const yesBtn = buttonGroup.querySelector(".yes-btn");
        const noBtn = buttonGroup.querySelector(".no-btn");

        noBtn.style.display =
          forceOneButton || refusalCount >= 3 ? "none" : "inline-block";
        yesBtn.style.display = "inline-block";
      }

      async function handleResponse(choice) {
        question.style.display = "none";
        buttonGroup.style.display = "none";
        tapHint.style.display = "none";

        const userText = choice === "y" ? "Iya" : "Tidak";
        await appendDialogue(userText, "vanilla");

        if (choice === "y") {
          await appendMultiDialogue([
            "baik! terima kasih!",
            "aku janji kamu nggak bakal nyesel kok 💕",
          ]);
        } else {
          const responses = [
            ["eh apa kamu yakin?", "setidaknya ini akan menyenangkan lohh! 🥺"],
            ["masi belum mau juga? 😢", "aku udah nyiapin semuanya loh.."],
            ["kamu jahat 😭", "tapi aku masih pengen kamu ikut..."],
          ];

          if (refusalCount < responses.length) {
            await appendMultiDialogue(responses[refusalCount]);
          } else {
            await appendDialogue("😔 yaudah deh, terakhir...");
            showQuestion(true);
            return;
          }

          refusalCount++;
        }

        showQuestion();
      }

      async function appendMultiDialogue(dialogues) {
        for (let i = 0; i < dialogues.length; i++) {
          await appendDialogue(dialogues[i]);
          if (i < dialogues.length - 1) {
            tapHint.style.display = "flex";
            await waitForClickToContinue();
            tapHint.style.display = "none";
          }
        }
      }

      function waitForClickToContinue() {
        return new Promise((resolve) => {
          const listener = () => {
            document.removeEventListener("click", listener);
            resolve();
          };
          document.addEventListener("click", listener);
        });
      }

      async function typeWriterEffect() {
        const text = title.textContent;
        title.textContent = "";
        for (let i = 0; i < text.length; i++) {
          title.textContent += text.charAt(i);
          await delay(60);
        }
      }

      async function showTitleAndFade() {
        title.classList.add("animated");
        await typeWriterEffect();
        await delay(1000);
        overlay.style.backgroundColor = "rgba(0,0,0,0.3)";
        await delay(2000);
        dialogueBox.style.display = "flex";
      }

      startDialogue();
    </script>
  </body>
</html>
